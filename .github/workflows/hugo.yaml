name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.163.0
      PAGEFIND_VERSION: 1.5.2
      PAGEFIND_SHA256: afb824a9e7f64905a934900481cea5be679c03975e527329e0e5e6cc70f5feda
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Hugo
        run: |
          HUGO_TAR="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          HUGO_SUMS="hugo_${HUGO_VERSION}_checksums.txt"
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${HUGO_TAR}"
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${HUGO_SUMS}"
          grep " ${HUGO_TAR}$" "${HUGO_SUMS}" | sha256sum -c -
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${HUGO_TAR}"
          rm "${HUGO_TAR}" "${HUGO_SUMS}"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Build the site
        run: |
          hugo build \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Index with Pagefind
        run: |
          PF_TAR="pagefind-v${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sLJO "https://github.com/Pagefind/pagefind/releases/download/v${PAGEFIND_VERSION}/${PF_TAR}"
          echo "${PAGEFIND_SHA256}  ${PF_TAR}" | sha256sum -c -
          mkdir -p "${HOME}/.local/pagefind"
          tar -C "${HOME}/.local/pagefind" -xf "${PF_TAR}"
          rm "${PF_TAR}"
          "${HOME}/.local/pagefind/pagefind" \
            --site public \
            --root-selector ".post-content" \
            --include-characters='-_.' \
            --glob="posts/**/*.html"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
