{{- define "main" }}

<header class="page-header">
  {{ partial "breadcrumbs.html" . }}
  <h1>{{ .Title }}</h1>
  {{- if .Description }}
  <div class="post-description">
    {{ .Description | markdownify }}
  </div>
  {{- end }}
</header>

<div id="library-app">

  <div class="library-search-wrap">
    <svg class="library-search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="library-search" type="search" placeholder="Search posts..." id="librarySearch" autocomplete="off" aria-label="Search posts" />
  </div>

  <div class="library-filters" id="filterControls" role="group" aria-label="Filter posts"></div>

  <div class="library-results-header">
    <span class="library-results-count" id="resultsCount"></span>
    <button class="library-clear-btn" id="clearBtn" type="button">Clear filters</button>
  </div>

  <div id="postList"></div>

  <nav class="library-pagination" id="pagination" role="navigation" aria-label="Pagination"></nav>

  <div class="library-empty" id="emptyState">
    <p>No posts match the current filters. <button type="button" class="library-clear-link" id="clearLink">Clear all filters</button></p>
  </div>

</div>

<script>
(function () {
  var posts = [
    {{- $pages := where site.RegularPages "Section" "posts" }}
    {{- range $i, $p := $pages }}
    {{- if $i }},{{ end }}
    {{- $cover := "" }}
    {{- with $p.Params.cover }}
    {{- with $p.Resources.GetMatch (.image | default "no-cover-match") }}
    {{- $cover = (.Fill "384x216 center webp q80").RelPermalink }}
    {{- end }}
    {{- end }}
    {
      "title": {{ $p.Title | jsonify | safeJS }},
      "summary": {{ with $p.Params.summary }}{{ . | jsonify | safeJS }}{{ else }}{{ $p.Summary | plainify | htmlUnescape | jsonify | safeJS }}{{ end }},
      "permalink": {{ $p.RelPermalink | jsonify | safeJS }},
      "cover": {{ $cover | jsonify | safeJS }},
      "date": {{ $p.Date.Format "January 2, 2006" | jsonify | safeJS }},
      "readingTime": {{ $p.ReadingTime }},
      "platforms": {{ $p.Params.platforms | default slice | jsonify | safeJS }},
      "tags": {{ $p.Params.tags | default slice | jsonify | safeJS }},
      "difficulty": {{ $p.Params.difficulty | default "" | jsonify | safeJS }}
    }
    {{- end }}
  ];

  var activeFilters = { platform: [], tag: [], diff: [], type: [] };
  var PAGE_SIZE = 8;
  var currentPage = 1;

  // "Resources" is a content TYPE, not a topical tag. It still lives in each
  // post's front-matter `tags`, but the library lifts it onto its own Type axis
  // so it constrains the topic / platform / difficulty counts instead of sitting
  // beside the topics. Topic chips are therefore the tags minus "Resources".
  var RESOURCE_TAG = 'Resources';
  posts.forEach(function (p) {
    p.type = (p.tags || []).indexOf(RESOURCE_TAG) > -1 ? 'Resources' : 'Walkthroughs';
  });

  var filtersEl = document.getElementById('filterControls');
  var postListEl = document.getElementById('postList');
  var paginationEl = document.getElementById('pagination');
  var resultsEl = document.getElementById('resultsCount');
  var emptyEl = document.getElementById('emptyState');
  var clearBtn = document.getElementById('clearBtn');
  var clearLink = document.getElementById('clearLink');
  var searchInput = document.getElementById('librarySearch');

  function collectValues(key) {
    var values = {};
    posts.forEach(function (p) {
      var arr = key === 'difficulty' ? (p.difficulty ? [p.difficulty] : []) : p[key] || [];
      arr.forEach(function (v) {
        values[v] = (values[v] || 0) + 1;
      });
    });
    return values;
  }

  var diffOrder = { 'Easy': 1, 'Medium': 2, 'Hard': 3 };
  var typeOrder = { 'Walkthroughs': 1, 'Resources': 2 };

  var CHEVRON = '<svg class="library-filter-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>';

  var axisLabels = { tag: 'Tag', diff: 'Difficulty', platform: 'Platform', type: 'Type' };
  var allFacets = [];

  // A facet with fewer than two distinct values cannot narrow anything, since
  // every post carries the same value, so no control is rendered for it. It
  // returns on its own the first time a second value ships in front matter.
  function buildFacet(filterKey, values, sortFn) {
    var keys = Object.keys(values);
    if (keys.length < 2) return;
    if (sortFn) keys.sort(sortFn);
    else keys.sort();

    var wrap = document.createElement('div');
    wrap.className = 'library-filter';

    var panelId = 'panel-' + filterKey;
    var trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'library-filter-trigger';
    trigger.setAttribute('aria-expanded', 'false');
    trigger.setAttribute('aria-controls', panelId);

    var tLabel = document.createElement('span');
    tLabel.textContent = axisLabels[filterKey];
    var tCount = document.createElement('span');
    tCount.className = 'library-filter-count';
    trigger.appendChild(tLabel);
    trigger.appendChild(tCount);
    trigger.insertAdjacentHTML('beforeend', CHEVRON);

    var panel = document.createElement('div');
    panel.className = 'library-filter-panel';
    panel.id = panelId;
    panel.setAttribute('role', 'group');
    panel.setAttribute('aria-label', axisLabels[filterKey]);
    panel.hidden = true;

    var options = [];
    keys.forEach(function (val) {
      var row = document.createElement('label');
      row.className = 'library-filter-option';

      var box = document.createElement('input');
      box.type = 'checkbox';
      box.value = val;
      box.setAttribute('data-filter', filterKey);

      var text = document.createElement('span');
      text.className = 'library-filter-option-label';
      text.textContent = val;

      var n = document.createElement('span');
      n.className = 'library-filter-option-count';
      n.textContent = values[val];

      row.appendChild(box);
      if (filterKey === 'diff') {
        var dot = document.createElement('span');
        dot.className = 'library-filter-dot library-filter-dot-' + val.toLowerCase();
        row.appendChild(dot);
      }
      row.appendChild(text);
      row.appendChild(n);

      box.addEventListener('change', function () { toggleValue(filterKey, val, box.checked); });
      panel.appendChild(row);
      options.push({ row: row, box: box, countEl: n, filter: filterKey, value: val });
    });

    trigger.addEventListener('click', function (e) {
      e.stopPropagation();
      setOpen(facet, panel.hidden);
    });

    wrap.appendChild(trigger);
    wrap.appendChild(panel);
    filtersEl.appendChild(wrap);

    var facet = { key: filterKey, trigger: trigger, panel: panel, countEl: tCount, options: options };
    allFacets.push(facet);
  }

  // Only one panel is open at a time; anything else stacks popups over content.
  function setOpen(facet, open) {
    allFacets.forEach(function (f) {
      var isTarget = f === facet;
      var next = isTarget && open;
      f.panel.hidden = !next;
      f.trigger.setAttribute('aria-expanded', next ? 'true' : 'false');
      f.panel.classList.remove('align-right');
    });
    if (open && facet) {
      // Flip the panel when it would otherwise run past the container's edge.
      var bounds = filtersEl.getBoundingClientRect();
      var rect = facet.panel.getBoundingClientRect();
      if (rect.right > bounds.right) facet.panel.classList.add('align-right');
    }
  }

  function closeAll() { setOpen(null, false); }

  function toggleValue(filterKey, value, checked) {
    var arr = activeFilters[filterKey];
    var idx = arr.indexOf(value);
    if (checked && idx === -1) arr.push(value);
    if (!checked && idx > -1) arr.splice(idx, 1);
    refresh();
  }

  var typeValues = {};
  posts.forEach(function (p) { typeValues[p.type] = (typeValues[p.type] || 0) + 1; });

  var platformValues = collectValues('platforms');
  var tagValues = collectValues('tags');
  delete tagValues[RESOURCE_TAG];
  var diffValues = collectValues('difficulty');

  // Topic first: it is the axis readers browse by. Difficulty led the old chip
  // row only because its labels were shortest, and that constraint is gone.
  buildFacet('tag', tagValues);
  buildFacet('diff', diffValues, function (a, b) {
    return (diffOrder[a] || 99) - (diffOrder[b] || 99);
  });
  buildFacet('platform', platformValues);
  buildFacet('type', typeValues, function (a, b) {
    return (typeOrder[a] || 99) - (typeOrder[b] || 99);
  });

  if (allFacets.length === 0) filtersEl.style.display = 'none';

  // Core matcher. opts.skip lets a facet group ignore its OWN active selection
  // when tallying counts, so sibling options in that group stay visible; every
  // other group (and the search box) still constrains the tally.
  function matchesFilters(post, opts) {
    opts = opts || {};

    if (opts.skip !== 'type' && activeFilters.type.length > 0) {
      if (activeFilters.type.indexOf(post.type) === -1) return false;
    }

    if (opts.skip !== 'platform' && activeFilters.platform.length > 0) {
      var postPlatforms = post.platforms || [];
      var platformMatch = activeFilters.platform.some(function (f) {
        return postPlatforms.indexOf(f) > -1;
      });
      if (!platformMatch) return false;
    }

    if (opts.skip !== 'tag' && activeFilters.tag.length > 0) {
      var postTags = post.tags || [];
      var tagMatch = activeFilters.tag.some(function (f) {
        return postTags.indexOf(f) > -1;
      });
      if (!tagMatch) return false;
    }

    if (opts.skip !== 'diff' && activeFilters.diff.length > 0) {
      if (!post.difficulty || activeFilters.diff.indexOf(post.difficulty) === -1) return false;
    }

    var query = searchInput.value.toLowerCase().trim();
    if (query) {
      var haystack = [
        post.title,
        post.summary,
        (post.platforms || []).join(' '),
        (post.tags || []).join(' '),
        post.difficulty || ''
      ].join(' ').toLowerCase();

      var words = query.split(/\s+/);
      var allMatch = words.every(function (w) { return haystack.indexOf(w) > -1; });
      if (!allMatch) return false;
    }

    return true;
  }

  function matchesFilter(post) {
    return matchesFilters(post);
  }

  // Count posts carrying a given value in a facet group, evaluated with that
  // group's own selection ignored (see matchesFilters skip).
  function countFor(filterKey, value) {
    return posts.filter(function (p) {
      if (!matchesFilters(p, { skip: filterKey })) return false;
      if (filterKey === 'diff') return p.difficulty === value;
      if (filterKey === 'type') return p.type === value;
      var field = filterKey === 'platform' ? p.platforms : p.tags;
      return (field || []).indexOf(value) > -1;
    }).length;
  }

  // Recompute every option's count against the current selection and disable the
  // ones that would return nothing, so a dead end is unreachable rather than
  // merely visible. A checked option is never disabled or it could not be undone.
  // The trigger carries the selected count, since a closed panel is the only
  // thing hiding which values are active.
  function updateCounts() {
    allFacets.forEach(function (f) {
      f.options.forEach(function (o) {
        var n = countFor(o.filter, o.value);
        o.countEl.textContent = n;
        var checked = o.box.checked;
        o.row.classList.toggle('is-empty', n === 0 && !checked);
        o.box.disabled = n === 0 && !checked;
        o.box.setAttribute('aria-label', o.value + ', ' + n + ' post' + (n !== 1 ? 's' : ''));
      });

      var active = activeFilters[f.key].length;
      f.countEl.textContent = active > 0 ? active : '';
      f.trigger.classList.toggle('active', active > 0);
      f.trigger.setAttribute('aria-label', axisLabels[f.key] + (active > 0 ? ', ' + active + ' selected' : ', no filter applied'));
    });
  }

  function refresh() {
    currentPage = 1;
    updateCounts();
    renderPosts();
  }

  function diffBadgeClass(diff) {
    if (diff === 'Easy') return 'library-badge-easy';
    if (diff === 'Medium') return 'library-badge-medium';
    if (diff === 'Hard') return 'library-badge-hard';
    return '';
  }

  function renderPosts() {
    var filtered = posts.filter(matchesFilter);

    var totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    var start = (currentPage - 1) * PAGE_SIZE;
    var pageSlice = filtered.slice(start, start + PAGE_SIZE);

    postListEl.innerHTML = '';

    pageSlice.forEach(function (post) {
      var card = document.createElement('a');
      card.href = post.permalink;
      card.className = 'library-post-card';

      if (post.cover) {
        var thumbWrap = document.createElement('div');
        thumbWrap.className = 'library-post-thumb';
        var thumb = document.createElement('img');
        thumb.src = post.cover;
        thumb.alt = '';
        thumb.loading = 'lazy';
        thumb.decoding = 'async';
        thumbWrap.appendChild(thumb);
        card.appendChild(thumbWrap);
      }

      var title = document.createElement('div');
      title.className = 'library-post-title';
      title.textContent = post.title;

      var summary = document.createElement('div');
      summary.className = 'library-post-summary';
      summary.textContent = post.summary;

      var meta = document.createElement('div');
      meta.className = 'library-post-meta';

      (post.platforms || []).forEach(function (p) {
        var badge = document.createElement('span');
        badge.className = 'library-badge library-badge-platform';
        badge.textContent = p;
        meta.appendChild(badge);
      });

      (post.tags || []).forEach(function (t) {
        var badge = document.createElement('span');
        badge.className = 'library-badge library-badge-tag';
        if (t === 'Resources') badge.className = 'library-badge library-badge-resource';
        badge.textContent = t;
        meta.appendChild(badge);
      });

      if (post.difficulty) {
        var diffBadge = document.createElement('span');
        diffBadge.className = 'library-badge ' + diffBadgeClass(post.difficulty);
        diffBadge.textContent = post.difficulty;
        meta.appendChild(diffBadge);
      }

      var date = document.createElement('span');
      date.className = 'library-post-date';
      date.textContent = post.date + ' \u00b7 ' + post.readingTime + ' min';
      meta.appendChild(date);

      card.appendChild(title);
      card.appendChild(summary);
      card.appendChild(meta);
      postListEl.appendChild(card);
    });

    resultsEl.textContent = filtered.length + ' post' + (filtered.length !== 1 ? 's' : '');
    emptyEl.style.display = filtered.length === 0 ? 'block' : 'none';

    renderPagination(filtered.length, totalPages);

    // Toggled with visibility, not display, so the button's box is always
    // reserved and applying the first filter shifts nothing below it.
    var activeCount = activeFilters.platform.length + activeFilters.tag.length + activeFilters.diff.length + activeFilters.type.length;
    var hasActive = activeCount > 0 || searchInput.value.trim() !== '';
    clearBtn.textContent = activeCount > 0 ? 'Clear filters (' + activeCount + ')' : 'Clear filters';
    clearBtn.style.visibility = hasActive ? 'visible' : 'hidden';
  }

  // Windowed page tokens: always first + last, a one-page window around the
  // current page, and '...' where a gap spans more than one page (a single-page
  // gap is filled with the number itself rather than an ellipsis).
  function pageList(current, total) {
    var delta = 1;
    var range = [];
    for (var i = 1; i <= total; i++) {
      if (i === 1 || i === total || (i >= current - delta && i <= current + delta)) {
        range.push(i);
      }
    }
    var out = [];
    var prev = 0;
    range.forEach(function (n) {
      if (prev) {
        if (n - prev === 2) out.push(prev + 1);
        else if (n - prev !== 1) out.push('...');
      }
      out.push(n);
      prev = n;
    });
    return out;
  }

  // Client-side pager. Hidden entirely at one page or no results, so the current
  // four-post library shows no controls until a sixth post pushes past page one.
  function renderPagination(totalResults, totalPages) {
    paginationEl.innerHTML = '';
    if (totalResults === 0 || totalPages <= 1) {
      paginationEl.style.display = 'none';
      return;
    }
    paginationEl.style.display = 'flex';

    function navBtn(label, targetPage, disabled) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'library-page-btn library-page-nav';
      b.textContent = label;
      if (disabled) {
        b.disabled = true;
        b.classList.add('library-page-disabled');
      } else {
        b.addEventListener('click', function () { goToPage(targetPage); });
      }
      return b;
    }

    paginationEl.appendChild(navBtn('\u2039 Prev', currentPage - 1, currentPage === 1));

    pageList(currentPage, totalPages).forEach(function (tok) {
      if (tok === '...') {
        var gap = document.createElement('span');
        gap.className = 'library-page-gap';
        gap.textContent = '\u2026';
        paginationEl.appendChild(gap);
        return;
      }
      var isCurrent = tok === currentPage;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'library-page-btn library-page-num' + (isCurrent ? ' library-page-active' : '');
      b.textContent = tok;
      if (isCurrent) {
        b.setAttribute('aria-current', 'page');
      } else {
        b.addEventListener('click', function () { goToPage(tok); });
      }
      paginationEl.appendChild(b);
    });

    paginationEl.appendChild(navBtn('Next \u203a', currentPage + 1, currentPage === totalPages));
  }

  function goToPage(n) {
    currentPage = n;
    renderPosts();
    var header = document.querySelector('.library-results-header');
    if (header && header.scrollIntoView) {
      header.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function clearAll() {
    activeFilters = { platform: [], tag: [], diff: [], type: [] };
    searchInput.value = '';
    allFacets.forEach(function (f) {
      f.options.forEach(function (o) { o.box.checked = false; });
    });
    closeAll();
    refresh();
  }

  searchInput.addEventListener('input', refresh);
  clearBtn.addEventListener('click', clearAll);
  clearLink.addEventListener('click', clearAll);

  // A panel that only closes by clicking its own trigger is a trap on touch.
  document.addEventListener('click', function (e) {
    if (!filtersEl.contains(e.target)) closeAll();
  });

  // Escape closes and returns focus to the trigger, so keyboard users are not
  // stranded inside a panel they cannot see out of.
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var open = allFacets.filter(function (f) { return !f.panel.hidden; })[0];
    if (!open) return;
    closeAll();
    open.trigger.focus();
  });

  refresh();
})();
</script>

{{- end }}{{/* end main */}}
